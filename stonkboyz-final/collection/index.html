<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STONKBOYZ — Collection</title>
<meta name="description" content="Browse all 2,222 Stonkboyz. One at a time. Filter by trait.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070807; --panel:#101210; --ink:#eef3e4; --mute:#7d8674;
  --line:#243023; --lime:#c6ff2a; --red:#ff3a32; --green:#2fde6a;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --display:"Anton",Impact,sans-serif;
  --mark:"Permanent Marker",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:var(--mono);min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(800px 360px at 80% -10%,rgba(198,255,42,.08),transparent 60%),
    var(--bg);
}
a{color:var(--lime);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto}

nav{
  position:sticky;top:0;z-index:20;
  background:rgba(7,8,7,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.navin{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:var(--mark);color:var(--lime);font-size:24px;transform:rotate(-2deg);text-shadow:0 0 16px rgba(198,255,42,.35)}
.navlinks{display:flex;gap:18px;font:600 11px var(--mono);text-transform:uppercase}
.navlinks a{color:var(--mute)}
.navlinks a:hover,.navlinks a.on{color:var(--lime);text-decoration:none}

h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,64px);letter-spacing:.02em;text-transform:uppercase;line-height:.88;margin:28px 0 8px}
.sub{color:var(--mute);font-size:13px;margin-bottom:20px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.filters select,.filters input{
  background:#0b0e0b;color:var(--ink);border:1px solid var(--line);
  font:600 11px var(--mono);padding:8px 10px;text-transform:uppercase;
}
.filters input{min-width:140px;text-transform:none}
.filters select:focus,.filters input:focus{outline:1px solid var(--lime)}

.stage{
  display:grid;grid-template-columns:minmax(260px,560px) 1fr;gap:22px;align-items:start;
  border:1px solid var(--lime);background:var(--panel);padding:16px;
}
@media(max-width:800px){.stage{grid-template-columns:1fr}.navlinks{display:none}}

.frame{background:#fff;border:1px solid var(--line);position:relative}
.frame img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff}
.navbtns{display:flex;gap:8px;margin-top:10px}
.navbtns button,.side button{
  flex:1;border:1px solid var(--lime);background:transparent;color:var(--lime);
  font:700 13px var(--mono);text-transform:uppercase;letter-spacing:.06em;
  padding:12px 10px;cursor:pointer;
}
.navbtns button:hover,.side button:hover{background:var(--lime);color:#081000}
.navbtns button:disabled{opacity:.35;cursor:not-allowed}

.kicker{font:700 10px var(--mono);color:var(--lime);letter-spacing:.14em;text-transform:uppercase}
.side h2{font-family:var(--display);font-size:42px;letter-spacing:.03em;margin:6px 0 10px}
.count{color:var(--mute);font:600 12px var(--mono);margin-bottom:16px}
.side dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.side dt{color:var(--mute);text-transform:uppercase;font-size:10px;letter-spacing:.08em;padding-top:4px}
.side dd{margin:0}
.empty{padding:40px 10px;color:var(--mute)}

.hint{margin:14px 0 40px;color:#555c50;font:500 11px var(--mono)}
</style>
</head>
<body>
<nav>
  <div class="wrap navin">
    <a class="logo" href="../mint/">STONKBOYZ</a>
    <div class="navlinks">
      <a href="../mint/">Desk</a>
      <a class="on" href="./">Collection</a>
      <a href="../mint/#mint">Mint on OpenSea</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <h1>The lineup.</h1>
  <p class="sub">2,222 lives. One at a time. Filter the traits, then step through only those Boyz. Mint is on OpenSea — date TBA, price TBA.</p>

  <div class="filters" id="filters">
    <input id="q" type="search" placeholder="# or trait…">
    <select id="sort">
      <option value="id"># order</option>
      <option value="rare">rarest first</option>
      <option value="common">most common</option>
    </select>
  </div>

  <div class="stage">
    <div>
      <div class="frame"><img id="pic" alt="Stonkboyz" width="560" height="560"></div>
      <div class="navbtns">
        <button type="button" id="prev">← Prev</button>
        <button type="button" id="next">Next →</button>
      </div>
    </div>
    <div class="side">
      <div class="kicker">Stonkboyz</div>
      <h2 id="name">#—</h2>
      <p class="count" id="pos">—</p>
      <dl id="traits"></dl>
      <p class="empty" id="empty" hidden>No Boyz match those traits. Clear a filter.</p>
    </div>
  </div>
  <p class="hint">Arrow keys or Prev/Next. Filters only walk the matches.</p>
</main>

<script>
const KEYS = ["Background","Clothes","Nose","Mouth","Eyes","Headwear","Tier"];
let ALL = [];
let view = [];
let i = 0;

function el(id){ return document.getElementById(id); }

function fillSelects(){
  const box = el("filters");
  KEYS.forEach(key => {
    const sel = document.createElement("select");
    sel.id = key;
    sel.innerHTML = `<option value="">${key}</option>`;
    [...new Set(ALL.map(t => t[key]))].filter(Boolean).sort().forEach(v => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
    box.appendChild(sel);
    sel.addEventListener("input", apply);
  });
  el("q").addEventListener("input", apply);
  el("sort").addEventListener("input", apply);
}

function apply(){
  const q = el("q").value.trim().toLowerCase();
  view = ALL.filter(t => {
    if (KEYS.some(k => { const f = el(k).value; return f && t[k] !== f; })) return false;
    if (!q) return true;
    if (String(t.id) === q.replace("#","")) return true;
    return KEYS.some(k => String(t[k]||"").toLowerCase().includes(q));
  });
  const sort = el("sort").value;
  if (sort === "rare") view.sort((a,b) => b.score - a.score);
  else if (sort === "common") view.sort((a,b) => a.score - b.score);
  else view.sort((a,b) => a.id - b.id);
  i = 0;
  show();
}

function show(){
  const empty = view.length === 0;
  el("empty").hidden = !empty;
  el("traits").hidden = empty;
  el("prev").disabled = empty || i <= 0;
  el("next").disabled = empty || i >= view.length - 1;
  if (empty) {
    el("pic").removeAttribute("src");
    el("name").textContent = "—";
    el("pos").textContent = "0 / 0";
    el("traits").innerHTML = "";
    return;
  }
  const t = view[i];
  el("pic").src = t.file;
  el("pic").alt = "Stonkboyz #"+t.id;
  el("name").textContent = "#"+t.id;
  el("pos").textContent = `${i+1} / ${view.length}` + (view.length !== ALL.length ? ` · of ${ALL.length}` : "");
  el("traits").innerHTML = KEYS.map(k => `<dt>${k}</dt><dd>${t[k]||"—"}</dd>`).join("")
    + `<dt>Score</dt><dd>${Number(t.score).toFixed(1)}</dd>`;
}

function step(d){
  if (!view.length) return;
  i = Math.max(0, Math.min(view.length-1, i+d));
  show();
}
el("prev").onclick = () => step(-1);
el("next").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

fetch("tokens.json").then(r => r.json()).then(data => {
  ALL = data;
  fillSelects();
  apply();
}).catch(() => {
  el("pos").textContent = "Could not load tokens.json — serve this folder over http.";
});
</script>
</body>
</html>
