const KEYS = ["Background","Clothes","Nose","Mouth","Eyes","Headwear","Tier"];
const grid = document.getElementById("grid");
const lb = document.getElementById("lb");
const count = document.getElementById("count");
const TOTAL = TOKENS.length;

function fillSelects() {
  for (const key of KEYS) {
    const vals = [...new Set(TOKENS.map(t => t[key]))].sort();
    const sel = document.getElementById(key);
    for (const v of vals) {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    }
  }
}
function filtered() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const filters = Object.fromEntries(KEYS.map(k => [k, document.getElementById(k).value]));
  let list = TOKENS.filter(t => KEYS.every(k => !filters[k] || t[k] === filters[k]));
  if (q) {
    list = list.filter(t =>
      String(t.id) === q.replace("#","") ||
      KEYS.some(k => String(t[k]).toLowerCase().includes(q))
    );
  }
  const sort = document.getElementById("sort").value;
  if (sort === "rare") list = [...list].sort((a,b) => b.score - a.score);
  else if (sort === "common") list = [...list].sort((a,b) => a.score - b.score);
  else list = [...list].sort((a,b) => a.id - b.id);
  return list;
}
function pad(n) { return String(n).padStart(4,"0"); }
function render() {
  const list = filtered();
  count.textContent = list.length + " / " + TOTAL;
  grid.innerHTML = list.map(t =>
    `<figure data-id="${t.id}">
      <img src="images/${pad(t.id)}.png" alt="#${t.id}" loading="lazy" width="1000" height="1000">
      <figcaption><span>#${t.id}</span><span>${t.Tier}</span></figcaption>
    </figure>`
  ).join("");
}
function openLB(id) {
  const t = TOKENS.find(x => x.id === id);
  if (!t) return;
  const rows = KEYS.map(k => `<dt>${k}</dt><dd>${t[k]}</dd>`).join("");
  lb.innerHTML = `<div class="lb">
    <img src="images/${pad(t.id)}.png" alt="#${t.id}">
    <aside>
      <button class="close" onclick="document.getElementById('lb').close()">×</button>
      <h2>Stonkboyz #${t.id}</h2>
      <dl>${rows}<dt>Rarity score</dt><dd>${t.score}</dd></dl>
    </aside>
  </div>`;
  lb.showModal();
}
grid.addEventListener("click", e => {
  const fig = e.target.closest("figure");
  if (fig) openLB(Number(fig.dataset.id));
});
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
document.querySelectorAll("select, #q").forEach(el => el.addEventListener("input", render));
fillSelects();
render();
</script>
